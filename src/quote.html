<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request a Quote — Snap Print</title>
  <meta name="description" content="Need a custom 3D printed part? Upload your design file and get a personalized quote." />
  <!-- @include head -->
</head>
<body>
  <div class="page">
    <!-- @include navbar -->

    <main id="main" class="quote-page">
      <div class="container">
        <div class="quote-page__header">
          <h1 class="quote-page__title">Request a Custom Quote</h1>
          <p class="quote-page__desc">Upload your design file, choose a material, and we'll email you a quote within 24 hours.</p>
        </div>

        <div class="quote-form-card">
          <form class="quote-form" id="quote-form" novalidate>
            <div class="form-group">
              <label class="form-label">Design File <span class="required">*</span></label>
              <div class="file-upload" id="file-upload-zone">
                <svg class="file-upload__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <p class="file-upload__text"><strong>Click to upload</strong> or drag and drop</p>
                <p class="file-upload__hint">STL, STEP, or STP files up to 10 MB</p>
                <input type="file" id="quote-file" accept=".stl,.step,.stp" required />
              </div>
              <div class="file-upload__preview" id="file-preview">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--brand-success);flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span class="file-upload__preview-name" id="file-name"></span>
                <span class="file-upload__preview-size" id="file-size"></span>
                <button type="button" class="btn btn-ghost btn-sm" id="file-remove" aria-label="Remove file"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
              </div>
              <span class="form-error" id="file-error">Please upload a valid file</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="quote-material">Preferred Material <span class="required">*</span></label>
              <select class="form-select" id="quote-material" required>
                <option value="">Select a material</option>
                <option value="PLA">PLA — Standard, biodegradable</option>
                <option value="PETG">PETG — Tough, heat-resistant</option>
                <option value="ABS">ABS — Durable, impact-resistant</option>
                <option value="Resin">Resin — High detail, smooth finish</option>
                <option value="Nylon">Nylon — Flexible, wear-resistant</option>
                <option value="TPU">TPU — Flexible, rubber-like</option>
                <option value="Other">Other — specify in notes</option>
              </select>
              <span class="form-error">Please select a material</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="quote-notes">Specifications & Notes</label>
              <textarea class="form-textarea" id="quote-notes" placeholder="Tolerance, finish, quantity, color..." rows="3"></textarea>
            </div>

            <div class="address-grid address-grid--2col">
              <div class="form-group">
                <label class="form-label" for="quote-name">Your Name <span class="required">*</span></label>
                <input class="form-input" type="text" id="quote-name" placeholder="John Doe" required autocomplete="name" />
                <span class="form-error">Required</span>
              </div>
              <div class="form-group">
                <label class="form-label" for="quote-email">Email <span class="required">*</span></label>
                <input class="form-input" type="email" id="quote-email" placeholder="john@example.com" required autocomplete="email" />
                <span class="form-error">Enter a valid email</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="quote-phone">Phone <span class="required">*</span></label>
              <input class="form-input" type="tel" id="quote-phone" placeholder="98765 43210" required autocomplete="tel" />
              <span class="form-error">Enter a valid phone number</span>
            </div>

            <!-- F-20: Cloudflare Turnstile (shown only when VITE_TURNSTILE_SITE_KEY is set) -->
            <div class="form-group turnstile-slot" id="quote-turnstile" hidden></div>

            <button type="submit" class="btn btn-primary btn-lg btn-full" id="quote-submit">
              <span id="quote-submit-text">Submit Quote Request</span>
            </button>
          </form>
        </div>
      </div>
    </main>

    <!-- @include footer -->
  </div>

  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/quote.js"></script>
</body>
</html>
