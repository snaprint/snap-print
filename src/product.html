<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Snap Print</title>
  <meta name="description" content="View product details — Snap Print 3D printed products." />
  <!-- @include head -->
</head>
<body>
  <div class="page">

    <!-- @include navbar -->

    <!-- Product Detail -->
    <main id="main" class="product-detail">
      <div class="container">
        <nav class="page-breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
          <a href="/">Home</a> <span class="separator">›</span> <a href="/">Shop</a> <span class="separator">›</span> <span id="breadcrumb-category">Loading...</span>
        </nav>

        <div class="product-detail__layout" id="product-layout">
          <!-- Loading state -->
          <div class="loader-center" style="grid-column:1/-1;">
            <div class="print-loader" role="img" aria-label="Loading product"><span></span><span></span><span></span><span></span></div>
            <span class="loader-center__text">Loading product…</span>
          </div>
        </div>

        <!-- Instagram Embed -->
        <section class="section instagram-section" id="instagram-section" style="display:none;">
          <div class="section-header">
            <h2 class="section-title instagram-section__title">
              <svg class="instagram-section__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
              See It In Action
            </h2>
          </div>
          <div class="instagram-section__grid" id="instagram-grid"></div>
        </section>

        <!-- Related Products -->
        <section class="section" id="related-products" style="display:none;">
          <div class="section-header">
            <h2 class="section-title">You Might Also Like</h2>
          </div>
          <div class="product-grid" id="related-grid"></div>
        </section>
      </div>
    </main>

    <!-- @include footer -->
  </div>

  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/product-detail.js"></script>
</body>
</html>
